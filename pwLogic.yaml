- gridRows: 3
  gridColumns: 10
  name: Assembly_Logic
  associatedDeviceName: MarryUpCsv
  triggerMode: OnEvent
  steps:
  - action:
      actionType: ParseCSV
      sourceType: Device
      delimiter: Comma
      skipFirstLine: Yes
      trimFields: Yes
      columns:
      - columnNumber: 1
        variable: SerialNumber
      - columnNumber: 2
        variable: WIPBatchNumber
      - columnNumber: 3
        variable: AssemblyStation
      - columnNumber: 4
        variable: AssemblyDate
      - columnNumber: 5
        variable: AssemblyTime
      - columnNumber: 6
        variable: TorqueValue
      - columnNumber: 7
        variable: Result
      status: ErrorStatus
      name: ParseAssyData
  - action:
      actionType: Math
      operator: IncrementAsNumber
      variable: AssemblyCount
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 2
  - action:
      actionType: ActionBirth
      partNumberType: Value
      partNumber: 666-777
      partProducerType: Constant
      partProducer: Angstrom
      partSerialNumberType: Variable
      partSerialNumber: SerialNumber
      lotQuantityType: Value
      lotQuantity: 1
      statusVariableType: Variable
      statusVariable: Status
      name: Cell 0 3
  - action:
      actionType: FillTemplate
      templateSourceType: Inline
      templateText: ${AssemblyDate} ${AssemblyTime}
      outputVariable: AssemblyDateTime
      name: FormatDateTime
  - action:
      actionType: CollectDataPoints
      partNumberType: Variable
      partNumber: Shaft
      partSerialNumberType: Variable
      partSerialNumber: SerialNumber
      attributes:
      - name: AssembledAt
        valueType: Variable
        value: AssemblyDateTime
      - name: WIPBatch
        valueType: Variable
        value: WIPBatchNumber
      - name: Result
        valueType: Variable
        value: Result
      status: ErrorStatus
      name: Cell 0 5
- gridRows: 3
  gridColumns: 10
  name: Balance_Logic
  associatedDeviceName: BalanceCsv
  triggerMode: OnEvent
  steps:
  - action:
      actionType: ParseCSV
      sourceType: Device
      delimiter: Comma
      skipFirstLine: Yes
      trimFields: Yes
      columns:
      - columnNumber: 1
        variable: Balance_SerialNumber
      - columnNumber: 2
        variable: BalanceDate
      - columnNumber: 3
        variable: BalanceTime
      - columnNumber: 4
        variable: UnbalanceAmount
      - columnNumber: 5
        variable: CorrectionWeight
      - columnNumber: 6
        variable: CorrectionAngle
      - columnNumber: 7
        variable: Balance_Result
      status: ErrorStatus
      fieldCountVariable: BalanceFieldCount
      name: Cell 0 1
  - action:
      actionType: Math
      operator: IncrementAsNumber
      variable: BalanceCount
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 2
- gridRows: 3
  gridColumns: 10
  name: PrintLabel_Logic
  associatedDeviceName: Screen:StatusMontior/PrintLabel
  triggerMode: OnEvent
  steps:
  - action:
      actionType: Math
      sourceType: Variable
      source: _RandInt
      operator: SetVariableToValue
      variable: PartId
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 1
  - action:
      actionType: ActionReadFromFile
      resultVariableType: Variable
      resultVariable: Label1Template
      fileSpecPathType: Variable
      fileSpecPath: PW_ConfigFolder
      fileSpecFilenameType: Value
      fileSpecFilename: OrigionalSupplierLabel
      fileSpecFileExtensionType: Value
      fileSpecFileExtension: zpl
      readMode: EntireFile
      name: Cell 0 1
  - action:
      actionType: FillTemplate
      templateSourceType: Variable
      templateVariable: Label1Template
      outputVariable: Label1TemplateOutput
      name: Cell 0 2
  - action:
      actionType: ActionWriteToDevice
      prefixType: Value
      sourceType: Variable
      source: Label1TemplateOutput
      suffixType: Value
      addCrLf: Yes
      device: ZebraPrinter
      status: ErrorStatus
      name: Cell 0 3
- gridRows: 3
  gridColumns: 10
  name: QA_Logic
  associatedDeviceName: FinalQACsv
  triggerMode: OnEvent
  steps:
  - action:
      actionType: ParseCSV
      sourceType: Device
      delimiter: Comma
      skipFirstLine: Yes
      trimFields: Yes
      columns:
      - columnNumber: 1
        variable: QASerialNumber
      - columnNumber: 2
        variable: InspectionDate
      - columnNumber: 3
        variable: InspectionTime
      - columnNumber: 4
        variable: VisionResult
      - columnNumber: 5
        variable: MeasurementData
      - columnNumber: 6
        variable: PassFail
      status: ErrorStatus
      fieldCountVariable: InspectionCounter
      name: Cell 0 1
  - action:
      actionType: Math
      operator: IncrementAsNumber
      variable: InspectionCount
      clearStartIndex: 1
      clearLength: 1
      name: Cell 0 2
